
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedBot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<div class="container">
    <div class="sidebar" id="sidebar"> 
        <button class="toggle-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>

        
        <!-- <h2 class="logo">MEDBOT</h2> -->
        <div class="logo">
    <img src="images/full.png" alt="MedBot Logo">
</div>
        <button class="primary-btn" onclick="newChat()">
            <i class="fa-solid fa-plus"></i>
            New Chat
        </button>

        <div class="auth-buttons">

            <button onclick="registerUser()">
                <i class="fa-solid fa-user-plus"></i>
                Register
            </button>

            <button onclick="login()">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
            </button>
            <button onclick="logoutUser()">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </button>
        </div>

        
        <div id="chatList" class="chat-list"></div>
<!-- CDAC LOGO -->
<div class="cdac-logo">
    <img src="images/cdac.png" alt="C-DAC Logo">
</div>
    </div>

    
    <div class="chatbox">
        <div class="topbar">
            <div class="top-left">   
                <h2>MEDBOT</h2>
            </div>
        </div>

        
        <div id="messages" class="messages"></div>

        
        <div class="input-box">

    <div class="input-wrapper">

        <input
            id="input"
            type="text"
            placeholder="Message MedBot..."
            autocomplete="off"
        />

    </div>
         
    <div class="speech-box">

    <select  id="langSelect" class="lang-select">
        <option value="en-IN">EN</option>
        <option value="hi-IN">हिं</option>
        <option value="bn-IN">বাংলা</option>
        <option value="ta-IN">தமிழ்</option>
        <option value="te-IN">తెలుగు</option>
        <option value="gu-IN">ગુજરાતી</option>
        <option value="ur-PK">اردو</option>
        <option value="as-IN">অসমীয়া</option>
    </select>

    <button id="micBtn" onclick="startListening()">
        <i class="fa-solid fa-microphone"></i>
    </button>

</div>
     
    <button onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
    </button>
</div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>

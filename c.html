<!DOCTYPE html>
<html>
<head>
    <title>MedBot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2 class="logo">MEDBOT</h2>

        <button class="primary-btn" onclick="newChat()">+ New Chat</button>

        <div class="auth-buttons">
            <button onclick="registerUser()">Register</button>
            <button onclick="login()">Login</button>
        </div>

        <div id="chatList" class="chat-list"></div>
    </div>

    <!-- CHAT AREA -->
    <div class="chatbox">

        <div id="messages" class="messages"></div>

        <div class="input-box">
            <input id="input" placeholder="Message MedBot..." />
            <button onclick="sendMessage()">📩</button>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
